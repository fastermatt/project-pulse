name: Pulse

on:
  schedule:
    - cron: "17 * * * *" # hourly; GitHub may delay scheduled runs a few minutes
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Test collector privacy and history
        run: node --test tests/*.test.mjs

      - name: Restore history from gh-pages
        run: |
          mkdir -p site/data
          if git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null; then
            git show origin/gh-pages:data/history.enc.json > site/data/history.enc.json || rm -f site/data/history.enc.json
          else
            echo "No gh-pages branch yet; starting fresh history."
          fi

      - name: Collect
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          GH_REPOS_TOKEN: ${{ secrets.GH_REPOS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PULSE_INTERVAL_MINUTES: "60"
        run: node scripts/collect.mjs

      - name: Verify published file allowlist
        run: node scripts/verify-public.mjs

      - name: Publish to gh-pages (single commit, no growing history)
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pulse $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Upload encrypted dashboard
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
