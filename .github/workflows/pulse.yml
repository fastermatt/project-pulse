name: Pulse

on:
  schedule:
    - cron: "17 * * * *" # hourly; GitHub may delay scheduled runs a few minutes
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore history from gh-pages
        run: |
          mkdir -p site/data
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git show origin/gh-pages:data/history.enc.json > site/data/history.enc.json || rm -f site/data/history.enc.json
          else
            echo "No gh-pages branch yet; starting fresh history."
          fi

      - name: Collect
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          GH_REPOS_TOKEN: ${{ secrets.GH_REPOS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PULSE_INTERVAL_MINUTES: "60"
        run: node scripts/collect.mjs

      - name: Publish to gh-pages (single commit, no growing history)
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pulse $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
